ext><text x="453" y="221" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="750" text-anchor="start" fill="#101F34">Searched online</text><text x="453" y="266" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#526278">Read rules, then</text><text x="453" y="296" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#526278">reached a group decision.</text><line x1="766" y1="230" x2="812" y2="230" stroke="#4766FF" stroke-width="4" stroke-linecap="round"/><path d="M 800,220 L 812,230 L 800,240" fill="none" stroke="#4766FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="825" y="100" width="326" height="256" rx="22" fill="#FFFFFF" stroke="#D9E3F1" stroke-width="2"/><rect x="854" y="127" width="268" height="43" rx="14" fill="#E8EEFF" stroke="none" stroke-width="1"/><text x="989" y="156" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#3659D9">DESIGN RESPONSE</text><text x="854" y="220" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="740" text-anchor="start" fill="#101F34">Ask about the move.</text><text x="854" y="261" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="740" text-anchor="start" fill="#101F34">Show supporting text.</text><text x="854" y="302" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="740" text-anchor="start" fill="#101F34">Show version &amp; status.</text><rect x="190" y="381" width="825" height="35" rx="10" fill="#FFF2D8" stroke="none" stroke-width="1"/><text x="602" y="405" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="630" text-anchor="middle" fill="#A35D06">Not measured: time, satisfaction, rule correctness or population demand</text></svg>