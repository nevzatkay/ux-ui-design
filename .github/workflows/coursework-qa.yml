name: Coursework structure and Markdown links

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout submitted files
        uses: actions/checkout@v4
      - name: Check weeks, presentations and local links
        run: python3 tools/validate_coursework.py
